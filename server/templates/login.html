{% extends "base.html" %}
{% block title %}Login - Wym C2{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto mt-20">
  <div class="bg-dark-600 border border-dark-400 rounded-xl p-8 shadow-2xl shadow-accent/5">
    <h1 class="font-mono text-xl font-bold text-accent text-center mb-6 tracking-wider">LOGIN <text y='.9em' font-size='12'>&#128293;</text></h1>
    {% if error %}
    <div class="alert-error text-center mb-4">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div>
        <label class="block text-xs text-muted uppercase tracking-wider mb-1.5">Username</label>
        <input type="text" name="username" autocomplete="username" required autofocus placeholder="admin"
          class="w-full bg-dark-800 border border-dark-400 rounded-lg px-4 py-2.5 text-sm font-mono text-gray-200 placeholder-gray-600 focus:border-accent focus:ring-1 focus:ring-accent/30 outline-none transition" autofocus>
      </div>
      <div>
        <label class="block text-xs text-muted uppercase tracking-wider mb-1.5">Password</label>
        <input type="password" name="password" autocomplete="current-password" required placeholder="********"
          class="w-full bg-dark-800 border border-dark-400 rounded-lg px-4 py-2.5 text-sm font-mono text-gray-200 placeholder-gray-600 focus:border-accent focus:ring-1 focus:ring-accent/30 outline-none transition">
      </div>
      <button type="submit"
        class="w-full bg-accent/10 border border-accent/30 text-accent font-mono font-bold text-sm uppercase tracking-wider py-3 rounded-lg hover:bg-accent/20 hover:border-accent/50 transition cursor-pointer">
        Authenticate
      </button>
    </form>
  </div>
</div>
{% endblock %}
