<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}Wym C2{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: { 900: '#000000', 800: '#0a0a0a', 700: '#0a0f0c', 600: '#0f1410', 500: '#141e18', 400: '#1a2e1f' },
            accent: { DEFAULT: '#00ff41', dim: 'rgba(0,255,65,0.08)' },
            muted: '#7a9a82',
            danger: { DEFAULT: '#ff3333', dim: 'rgba(255,51,51,0.1)' },
          },
          fontFamily: { mono: ['JetBrains Mono', 'Cascadia Code', 'Consolas', 'monospace'], sans: ['Inter', 'Segoe UI', 'system-ui', 'sans-serif'] },
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/xterm/xterm.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128293;</text></svg>">
</head>
<body class="bg-black text-gray-200 min-h-screen">
<div class="grid-bg"></div>
<header class="sticky top-0 z-50 bg-dark-600/80 backdrop-blur border-b border-dark-400">
  <div class="max-w-screen-xl mx-auto flex items-center h-12 px-4">
    <a href="/" class="font-mono font-bold text-accent text-lg tracking-wider mr-8">Wym<span class="text-gray-400 font-normal text-sm ml-1">C2</span></a>
    {% if user %}
    <nav class="flex items-center gap-1 text-sm">
      <a href="/dashboard" class="px-3 py-1.5 rounded hover:bg-accent/10 hover:text-accent transition">Agents</a>
      <a href="/terminal" class="px-3 py-1.5 rounded hover:bg-accent/10 hover:text-accent transition">Terminal</a>
      <a href="/explorer" class="px-3 py-1.5 rounded hover:bg-accent/10 hover:text-accent transition">Explorer</a>
      <a href="/generate" class="px-3 py-1.5 rounded hover:bg-accent/10 hover:text-accent transition">Builder</a>
      <a href="/stuff" class="px-3 py-1.5 rounded hover:bg-accent/10 hover:text-accent transition">Stuff</a>
      <a href="/info" class="px-3 py-1.5 rounded hover:bg-accent/10 hover:text-accent transition">Info</a>
    </nav>
    <div class="ml-auto relative" id="user-menu-wrap">
      <button id="user-menu-btn" class="flex items-center gap-1.5 px-3 py-1.5 rounded hover:bg-accent/10 hover:text-accent transition text-sm cursor-pointer">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        {{ user }}
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>
      <div id="user-menu-dd" class="absolute right-0 top-full mt-1 bg-dark-600 border border-dark-400 rounded-lg shadow-xl min-w-[160px] py-1 z-50" style="display:none">
        <a href="/users" class="block px-4 py-2 text-sm hover:bg-accent/10 hover:text-accent transition">Users</a>
        <hr class="border-dark-400 my-1">
        <a href="/logout" class="block px-4 py-2 text-sm hover:bg-danger/10 hover:text-danger transition">Logout</a>
      </div>
    </div>
    {% endif %}
  </div>
</header>
<main class="relative z-10 max-w-screen-xl mx-auto px-4 py-6">
  {% block content %}{% endblock %}
</main>
<script src="/static/app.js"></script>
{% if user %}
<script>
  (function(){
    var wrap = document.getElementById('user-menu-wrap');
    var btn = document.getElementById('user-menu-btn');
    var dd = document.getElementById('user-menu-dd');
    var open = false;
    function toggleMenu(){
      open = !open;
      dd.style.display = open ? 'block' : 'none';
    }
    function closeMenu(){
      open = false;
      dd.style.display = 'none';
    }
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      toggleMenu();
    });
    document.addEventListener('click', function(e){
      if(!wrap.contains(e.target)) closeMenu();
    });
  })();
</script>
{% endif %}
<script>var CSRF_TOKEN = "{{ csrf_token }}";</script>
{% block scripts %}{% endblock %}
</body>
</html>
