<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1080" role="img" aria-label="Wym C2 agent lifecycle and lateral movement sequence diagram">
  <defs>
    <style>
      .bgfill{ fill: #000000; }
      .sd { stroke: #5b7a66; fill: none; stroke-width: 1px; stroke-dasharray: 6 5; }
      .sg { stroke: #00ff41; fill: none; stroke-width: 1px; }
      .sga{ stroke: #00ff41; fill: none; stroke-width: 1px; }
      .sgl{ stroke: #1f3527; fill: none; stroke-width: 1px; }
      .box{ fill: #0d1a12; stroke: #1a2e1f; stroke-width: 1px; rx: 10px; }
      .lane{ fill: #0a0f0c; stroke: #1a2e1f; stroke-width: 1px; }
      .hd { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 17px; font-weight: bold; fill: #00ff41; text-anchor: middle; }
      .tM { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 13px; fill: #00ff41; text-anchor: middle; }
      .tW { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 13px; fill: #e6ffe9; text-anchor: middle; }
      .tD { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 13px; fill: #9fb8a6; text-anchor: middle; }
      .tS { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 11px; fill: #7a9a82; text-anchor: middle; }
      .t1 { fill: #7a9a82; font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 15px; letter-spacing: 3px; }
      .sec{ fill: #3f6a52; font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 13px; letter-spacing: 4px; }
      .bd { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 11px; font-weight: bold; fill: #00ff41; text-anchor: middle; }
      .bb { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-size: 10px; fill: #7a9a82; text-anchor: middle; }
      .pill { fill: #0a0f0c; stroke: #1a2e1f; stroke-width: 1px; rx: 5px; }
    </style>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#00ff41"/>
    </marker>
    <marker id="ad" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5b7a66"/>
    </marker>
  </defs>

  <rect class="bgfill" x="0" y="0" width="1200" height="1080"/>

  <text x="30" y="30" class="t1">AGENT &#8596; SERVER LIFECYCLE &#183; LATERAL MOVEMENT</text>

  <!-- lane headers -->
  <rect class="lane" x="125" y="54" width="150" height="50"/>
  <rect class="lane" x="460" y="54" width="120" height="50"/>
  <rect class="lane" x="750" y="54" width="120" height="50"/>
  <rect class="lane" x="1010" y="54" width="120" height="50"/>
  <text class="hd" x="200" y="86">OPERATOR</text>
  <text class="hd" x="520" y="86">C2 SERVER</text>
  <text class="hd" x="810" y="86">AGENT</text>
  <text class="hd" x="1070" y="86">PEER AGENT</text>

  <!-- lifelines -->
  <line class="sgl" x1="200" y1="118" x2="200" y2="995"/>
  <line class="sgl" x1="520" y1="118" x2="520" y2="995"/>
  <line class="sgl" x1="810" y1="118" x2="810" y2="995"/>
  <line class="sgl" x1="1070" y1="118" x2="1070" y2="995"/>

  <!-- 1 register (solid request) -->
  <line class="sg" x1="810" y1="165" x2="524" y2="165" marker-end="url(#ag)"/>
  <rect class="pill" x="361" y="177" width="613" height="20"/>
  <text class="tW" x="667" y="192">POST /api/register {hostname, username, os, arch, pid, ip, type, version}</text>

  <!-- 2 register reply (sd) -->
  <line class="sd" x1="520" y1="210" x2="806" y2="210" marker-end="url(#ad)"/>
  <rect class="pill" x="489" y="222" width="348" height="20"/>
  <text class="tD" x="663" y="237">agent_id assigned &#183; persist to state file</text>

  <!-- 3 create task (sd) -->
  <line class="sd" x1="200" y1="290" x2="516" y2="290" marker-end="url(#ad)"/>
  <rect class="pill" x="170" y="257" width="377" height="20"/>
  <text class="tD" x="358" y="272">create task: type + args (SQLite queue)</text>

  <!-- 4 checkin (solid) + self-loop bracket -->
  <line class="sg" x1="810" y1="345" x2="524" y2="345" marker-end="url(#ag)"/>
  <text class="tM" x="667" y="327">POST /api/checkin {agent_id}</text>

  <path class="sgl" d="M 856 336 H 846 V 384 H 856"/>
  <text class="tS" x="946" y="355" text-anchor="start">every interval &#177; jitter</text>
  <text class="tS" x="946" y="373" text-anchor="start">(default 10 s)</text>

  <!-- 5 checkin reply (sd) -->
  <line class="sd" x1="520" y1="390" x2="806" y2="390" marker-end="url(#ad)"/>
  <rect class="pill" x="473" y="402" width="380" height="20"/>
  <text class="tD" x="663" y="417">200 {tasks: [...]} &#183; 404 unknown &#8594; re-register</text>

  <!-- 6 task (solid) -->
  <line class="sg" x1="520" y1="460" x2="806" y2="460" marker-end="url(#ag)"/>
  <rect class="pill" x="470" y="427" width="387" height="20"/>
  <text class="tM" x="663" y="442">task {type: &quot;shell&quot;, args: {command, timeout}}</text>

  <!-- 7 execute box -->
  <rect class="box" x="675" y="470" width="270" height="58"/>
  <text class="bd" x="810" y="492">EXECUTE TASK (LOCALLY)</text>
  <text class="bb" x="810" y="511">shell &#183; upload &#183; download &#183; keylog &#183; steal</text>

  <!-- 8 result (solid) -->
  <line class="sg" x1="810" y1="595" x2="524" y2="595" marker-end="url(#ag)"/>
  <rect class="pill" x="481" y="607" width="371" height="20"/>
  <text class="tM" x="667" y="622">POST /api/result {task_id, output, exit_code}</text>

  <!-- 9 dashboard (sd) -->
  <line class="sd" x1="520" y1="668" x2="204" y2="668" marker-end="url(#ad)"/>
  <rect class="pill" x="174" y="635" width="371" height="20"/>
  <text class="tD" x="360" y="650">dashboard updates &#183; auto-retry unacked tasks</text>

  <!-- 10 idle note -->
  <rect class="pill" x="361" y="685" width="558" height="20"/>
  <text class="tD" x="640" y="700">sleep interval &#177; jitter &#183; unacked tasks re-sent after WYM_RETRY_AFTER</text>

  <!-- lateral movement -->
  <text x="30" y="730" class="sec">— LATERAL MOVEMENT —</text>

  <!-- 11 lateral task (sd) -->
  <line class="sd" x1="520" y1="768" x2="806" y2="768" marker-end="url(#ad)"/>
  <rect class="pill" x="392" y="780" width="480" height="20"/>
  <text class="tM" x="632" y="795">lateral task {subnet} + creds (WYM_LAT_USER / WYM_LAT_PASS)</text>

  <!-- 12 lateral execute box -->
  <rect class="box" x="675" y="818" width="270" height="72"/>
  <text class="bd" x="810" y="840">SCAN LAN (arp -a / ip neigh)</text>
  <text class="bb" x="810" y="858">copy self + relaunch on each peer</text>
  <text class="bb" x="810" y="876">net use / sshpass scp</text>

  <!-- 13 deploy (solid agent->peer) -->
  <line class="sga" x1="810" y1="928" x2="1066" y2="928" marker-end="url(#ag)"/>
  <rect class="pill" x="759" y="895" width="363" height="20"/>
  <text class="tM" x="940" y="910">deploy agent &#183; start (net use / sshpass scp)</text>

  <!-- 14 peer registers (solid peer->server) -->
  <line class="sga" x1="1070" y1="968" x2="524" y2="968" marker-end="url(#ag)"/>
  <rect class="pill" x="635" y="935" width="324" height="20"/>
  <text class="tM" x="797" y="950">POST /api/register (new peer agent joins)</text>

  <!-- peer note -->
  <text class="tS" x="1070" y="992">peer re-enters register &#8594; checkin loop</text>

  <!-- footer -->
  <line class="sgl" x1="50" y1="1022" x2="1150" y2="1022"/>
  <text class="tS" x="600" y="1046">one wire protocol &#183; 14 client languages &#183; agent tokens &#183; SQLite task queue</text>
</svg>