<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="Wym C2 logo">
  <defs>
    <style>
      .bg   { fill: #0a0f0c; stroke: #1a2e1f; stroke-width: 2px; }
      .hex  { fill: #0d1a12; stroke: #00ff41; stroke-width: 3px; }
      .orbit{ fill: none; stroke: #00ff41; stroke-width: 1px; stroke-dasharray: 3 7; opacity: .4; }
      .t1   { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-weight: bold; fill: #00ff41; }
      .t2   { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; font-weight: bold; fill: #e6ffe9; }
      .tag  { font-family: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; fill: #7a9a82; letter-spacing: 4px; }
      .dot  { fill: #3f6a52; }
      .dotb { fill: #5b7a66; }
      .glyph{ fill: none; stroke: #00ff41; stroke-width: 12; stroke-linecap: square; stroke-linejoin: miter; }
      .chn  { fill: none; stroke: #00ff41; stroke-width: 4; stroke-linecap: square; }
    </style>
    <pattern id="mesh" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#00ff41" opacity="0.22"/>
    </pattern>
  </defs>

  <rect class="bg" x="50" y="0" width="1100" height="320" rx="36"/>
  <rect x="50" y="0" width="1100" height="320" rx="36" fill="url(#mesh)" opacity="0.05"/>

  <!-- futuristic orbit ring (behind hexagon) -->
  <circle class="orbit" cx="258" cy="160" r="100"/>

  <!-- hexagon symbol, matched to the text block height (78..242) and centered at (258,160) -->
  <polygon class="hex" points="258,78 329,121 329,199 258,242 187,199 187,121"/>

  <!-- monogram: angular Decepticon-style W, sharp mitered zigzag + chin bar + antenna -->
  <path class="glyph" d="M 232 134 L 246 192 L 258 128 L 270 192 L 284 134"/>
  <line class="chn" x1="240" y1="192" x2="276" y2="192"/>
  <path class="chn" d="M 247 128 L 258 112 L 269 128"/>

  <!-- ambient starfield dots -->
  <circle cx="88" cy="30" r="2.0" class="dot"/>
  <circle cx="170" cy="38" r="1.4" class="dotb"/>
  <circle cx="246" cy="24" r="2.2" class="dot"/>
  <circle cx="330" cy="42" r="1.3" class="dotb"/>
  <circle cx="408" cy="26" r="2.0" class="dot"/>
  <circle cx="500" cy="40" r="1.5" class="dotb"/>
  <circle cx="590" cy="24" r="2.2" class="dot"/>
  <circle cx="672" cy="40" r="1.3" class="dotb"/>
  <circle cx="762" cy="26" r="2.0" class="dot"/>
  <circle cx="846" cy="40" r="1.5" class="dotb"/>
  <circle cx="930" cy="24" r="2.2" class="dot"/>
  <circle cx="1022" cy="38" r="1.3" class="dotb"/>
  <circle cx="1112" cy="30" r="2.0" class="dot"/>
  <circle cx="70" cy="262" r="1.5" class="dotb"/>
  <circle cx="150" cy="290" r="2.2" class="dot"/>
  <circle cx="232" cy="272" r="1.3" class="dotb"/>
  <circle cx="322" cy="298" r="2.0" class="dot"/>
  <circle cx="420" cy="266" r="1.5" class="dotb"/>
  <circle cx="505" cy="292" r="2.2" class="dot"/>
  <circle cx="600" cy="270" r="1.3" class="dotb"/>
  <circle cx="688" cy="296" r="2.0" class="dot"/>
  <circle cx="782" cy="268" r="1.5" class="dotb"/>
  <circle cx="872" cy="294" r="2.2" class="dot"/>
  <circle cx="960" cy="272" r="1.3" class="dotb"/>
  <circle cx="1050" cy="298" r="2.0" class="dot"/>
  <circle cx="1138" cy="266" r="1.5" class="dotb"/>
  <circle cx="112" cy="94" r="1.6" class="dot"/>
  <circle cx="84" cy="150" r="2.2" class="dotb"/>
  <circle cx="128" cy="208" r="1.6" class="dot"/>
  <circle cx="1106" cy="120" r="2.0" class="dot"/>
  <circle cx="1080" cy="180" r="1.4" class="dotb"/>
  <circle cx="1122" cy="234" r="2.0" class="dot"/>

  <!-- wordmark (single line, two-tone) -->
  <text class="t1" x="416" y="157" font-size="88">WYM</text>
  <text class="t2" x="580" y="157" font-size="88">C2</text>

  <!-- tagline -->
  <text class="tag" x="416" y="209" font-size="20">COMMAND &amp; CONTROL FRAMEWORK</text>
  <text class="tag" x="416" y="239" font-size="15" letter-spacing="2px">14 CLIENT LANGUAGES  &#183;  HTTP/JSON  &#183;  WIN/LINUX/macOS</text>
</svg>