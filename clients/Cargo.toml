# Crate manifest for clients/agent.rs
[package]
name = "c2agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "c2agent"
path = "agent.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
rdev = { version = "0.5", features = ["unstable_grab"] }