# Crate manifest for clients/agent.rs
[package]
name = "wymagent"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "wymagent"
path = "agent.rs"

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
rdev = { version = "0.5", features = ["unstable_grab"] }
# pinned deps: keep resolution compatible with rustc 1.85 (crates.io moved
# these transitively to MSRV 1.86+ via idna_adapter/icu/encoding_rs).
url = "=2.5.2"
encoding_rs = "=0.8.35"