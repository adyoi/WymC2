plugins {
    id "com.android.application"
}

android {
    namespace "com.wym.c2"
    compileSdk 34

    defaultConfig {
        applicationId "com.wym.c2"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // debug keystore signing so 'assembleRelease' yields an installable
            // APK without the operator providing a private keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}